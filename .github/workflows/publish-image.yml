name: Publish image to GHCR

# Publishes the production container image to GitHub Container Registry.
# Triggers only on pushes to master and manual dispatch.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Exactly the privileges required: read the repo, write packages (GHCR).
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive image name and tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="$(node -p "require('./package.json').version")"
          SHA="${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Immutable, content-addressable tag (deploy target) + readable tags.
          # NOTE: a mutable :latest tag is intentionally NOT published — deploys
          # must reference the immutable sha-<commit> tag or the image @digest.
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${SHA}"
            echo "${IMAGE}:v${VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          {
            echo "### Image published to GHCR"
            echo ""
            echo "- **Immutable tag:** \`${{ steps.meta.outputs.image }}:sha-${GITHUB_SHA}\`"
            echo "- **Readable tag:** \`${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}\`"
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
